<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تجربة أصوات مجلسك</title>
<style>
  :root { --bg: #0d2b20; --card: #143a2b; --gold: #d4af37; --text: #f3ead2; --dim: #bfb59a; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, sans-serif; padding: 16px; }
  h1 { color: var(--gold); font-size: 22px; margin: 0 0 4px; }
  h2 { color: var(--gold); font-size: 18px; margin: 24px 0 8px; }
  p { color: var(--dim); margin: 0 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  button { width: 100%; min-height: 48px; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--gold); border-radius: 12px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>تجربة أصوات مجلسك</h1>
  <p>اضغط أي زر لتسمعه. أرسل رمز الصوت الذي يعجبك (مثل turn3 أو win12) ليُستخدم في اللعبة.</p>

  <h2 id="h-game">الأصوات المستخدمة الآن في اللعبة</h2>
  <ul aria-labelledby="h-game" id="game"></ul>

  <div id="cats"></div>
  <p id="credits" style="margin-top:24px;font-size:13px"></p>
</main>
<script>
  // كل حدث في اللعبة وما يُسمع فيه (أسماء الملفات في مجلد الأصوات)
  const GAME = [
    ['خلط وتوزيع الورق', ['shuffle']],
    ['رمي ورقة', ['card1']],
    ['قطع بالحكم', ['shove1', 'card1']],
    ['سحب الأكلة', ['slide7']],
    ['شراء حكم', ['bid']],
    ['شراء صن', ['bid']],
    ['تأكيد الحكم', ['bid']],
    ['دبل', ['bid', 'bid']],
    ['ثري', ['bid', 'bid', 'bid']],
    ['فور', ['bid', 'bid', 'bid', 'bid']],
    ['قهوة', ['bid', 'bid', 'bid', 'cup1']],
    ['مشروع', ['fan', 'chips1']],
    ['بلوت', ['collide', 'chips2']],
    ['دورك', ['turn']],
    ['فزت بالصكة', ['chips3', 'chips4', 'collide2', 'handle1']],
    ['خسرت الصكة', ['lay1', 'lay2']],
    ['كبوت', ['kaboot', 'chips3', 'chips4', 'chips5', 'chips6']],
    ['فزت بالمباراة', ['match-win']],
    ['خسرت المباراة', ['match-lose']],
  ];
  const GAPS = { bid: 0.2 };
  function playSeq(names, dir) {
    let at = 0;
    for (const n of names) {
      const a = new Audio(`${dir}${n}.mp3`);
      setTimeout(() => a.play().catch(() => {}), at * 1000);
      at += GAPS[n] ?? 0.14;
    }
  }
  function addButton(list, label, onClick) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.textContent = label;
    b.addEventListener('click', onClick);
    li.appendChild(b);
    list.appendChild(li);
  }
  const game = document.getElementById('game');
  for (const [label, names] of GAME) addButton(game, label, () => playSeq(names, ''));

  // البدائل من الإنترنت (يجمعها preview-sounds.yml): مرتبة حسب الحدث، ولكل صوت مصدره ورخصته
  const CATS = [
    ['turn', 'بدائل نغمة "دورك"'],
    ['cards', 'بدائل أصوات الورق (سحب الأكلة)'],
    ['bid', 'بدائل أصوات الشراء والدبل (فيش وعملات)'],
    ['win', 'بدائل الفوز (صكة، كبوت، مباراة)'],
    ['lose', 'بدائل الخسارة'],
  ];
  const cats = document.getElementById('cats');
  fetch('preview/catalog.json').then((r) => r.json()).then((items) => {
    for (const [id, title] of CATS) {
      const list = items.filter((x) => x.cat === id);
      if (!list.length) continue;
      const h = document.createElement('h2');
      h.id = `h-${id}`;
      h.textContent = `${title} (${list.length})`;
      const ul = document.createElement('ul');
      ul.setAttribute('aria-labelledby', h.id);
      cats.append(h, ul);
      list.forEach((x, i) => addButton(ul, `${id}${i + 1}. ${x.title} — ${x.source}`, () => new Audio(x.src).play().catch(() => {})));
    }
    document.getElementById('credits').textContent =
      'المصادر: Mixkit (رخصة Mixkit المجانية)، OpenGameArt (CC0 وبعضها CC-BY)، Kenney (CC0).';
  }).catch(() => { cats.textContent = 'تعذّر تحميل قائمة البدائل'; });
</script>
</body>
</html>
