# رفع Cloud Functions وقواعد Firestore تلقائياً عند تعديلها.
# يتطلب سر GitHub باسم FIREBASE_SERVICE_ACCOUNT (محتوى ملف JSON لحساب الخدمة).
name: Deploy Firebase

on:
  push:
    paths:
      - functions/**
      - shared/**
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - .github/workflows/deploy-firebase.yml
  workflow_dispatch:

concurrency: firebase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm ci && npm test
      - name: Install functions deps
        run: npm ci --prefix functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        run: npx --yes firebase-tools@15 deploy --only functions,firestore --project majlisk-87eef --non-interactive --force
