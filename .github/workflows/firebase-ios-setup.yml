# إعداد Firebase للآيفون (مرة واحدة، تشغيل يدوي): ملف GoogleService-Info.plist وتفعيل الدخول بـ Apple
name: Firebase iOS setup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix worker
      - name: Setup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npx -y tsx@4.19.2 scripts/firebase-ios-setup.ts
      - name: Commit config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add ios/GoogleService-Info.plist
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Add Firebase iOS config (GoogleService-Info.plist)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
