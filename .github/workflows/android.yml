# بناء تطبيق أندرويد (APK للتجربة) عند كل تعديل، ونشره كإصدار "android-latest" للتنزيل المباشر.
name: Android APK

on:
  push:
    paths:
      - src/**
      - shared/**
      - public/**
      - android/**
      - index.html
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - .env
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency: android-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build web app
        run: npm ci && npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../majlisk.apk
      - name: Publish android-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: مجلسك — أحدث نسخة أندرويد للتجربة
          body: "نسخة تجريبية تُبنى تلقائياً من آخر تعديل (${{ github.sha }}). نزّل majlisk.apk وثبّته على جوالك."
          prerelease: true
          files: majlisk.apk
