# نشر خادم مجلسك على Cloudflare Workers تلقائياً (نسخة الويب مقفلة؛ العنوان يقدّم صفحة تعريف وسياسة الخصوصية فقط).
# أسرار GitHub المطلوبة: CLOUDFLARE_API_TOKEN, FIREBASE_SERVICE_ACCOUNT
# اختياري: REALTIME_APP_SECRET (مفتاح Cloudflare Realtime للمحادثة الصوتية)
# اختياري: APPSTORE_IAP_KEY / APPSTORE_IAP_KEY_ID / APPSTORE_IAP_ISSUER_ID (التحقق من مشتريات الآيفون)
# (معرّف الحساب موجود في worker/wrangler.jsonc)
name: Deploy Worker

on:
  push:
    paths:
      - worker/**
      - shared/**
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - .env
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:
    inputs:
      tail_minutes:
        description: للتشخيص فقط — يتابع سجل الخادم كم دقيقة بدل النشر (اتركه فاضي للنشر)
        default: ''
      grant_gift:
        description: يمنح هدية الترحيب لكل الحسابات الموجودة بدل النشر (yes)
        default: ''
      rename_from:
        description: تغيير اسم مستخدم بدل النشر — الاسم الحالي
        default: ''
      rename_to:
        description: الاسم الجديد
        default: ''

concurrency: worker-deploy

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || (inputs.tail_minutes == '' && inputs.grant_gift == '' && inputs.rename_from == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci && npm ci --prefix worker
      - name: Tests
        run: npm test
      - name: Ensure workers.dev subdomain
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT=$(grep -o '"account_id": *"[^"]*"' worker/wrangler.jsonc | sed 's/.*"\([0-9a-f]*\)"$/\1/')
          API="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/subdomain"
          CURRENT=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "$API" | jq -r '.result.subdomain // empty')
          if [ -n "$CURRENT" ]; then echo "subdomain: $CURRENT"; exit 0; fi
          for NAME in majlisk majlisk-sa majlisk-app majlisk-$ACCOUNT; do
            NAME=${NAME:0:63}
            OK=$(curl -s -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$NAME\"}" "$API" | jq -r '.success')
            if [ "$OK" = "true" ]; then echo "registered subdomain: $NAME"; exit 0; fi
          done
          echo "could not register a workers.dev subdomain" && exit 1
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          secrets: |
            FIREBASE_SERVICE_ACCOUNT
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Voice chat secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REALTIME_APP_SECRET: ${{ secrets.REALTIME_APP_SECRET }}
        working-directory: worker
        run: |
          if [ -z "$REALTIME_APP_SECRET" ]; then echo "REALTIME_APP_SECRET not set — voice chat disabled"; exit 0; fi
          printf '%s' "$REALTIME_APP_SECRET" | npx wrangler secret put REALTIME_APP_SECRET
      - name: App Store purchase secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPSTORE_IAP_KEY: ${{ secrets.APPSTORE_IAP_KEY }}
          APPSTORE_IAP_KEY_ID: ${{ secrets.APPSTORE_IAP_KEY_ID }}
          APPSTORE_IAP_ISSUER_ID: ${{ secrets.APPSTORE_IAP_ISSUER_ID }}
        working-directory: worker
        run: |
          if [ -z "$APPSTORE_IAP_KEY" ]; then echo "App Store purchase key not set yet"; exit 0; fi
          for n in APPSTORE_IAP_KEY APPSTORE_IAP_KEY_ID APPSTORE_IAP_ISSUER_ID; do printf '%s' "${!n}" | npx wrangler secret put $n; done
      - name: Smoke test
        run: |
          sleep 5
          curl -s https://majlisk-api.majlisk.workers.dev/api/health; echo
          curl -s -X POST -H "Content-Type: application/json" --data '{"username":"test_check"}' https://majlisk-api.majlisk.workers.dev/api/username/available; echo

  tail:
    if: github.event_name == 'workflow_dispatch' && inputs.tail_minutes != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix worker
      - name: Tail
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          timeout $(( ${{ inputs.tail_minutes }} * 60 )) npx wrangler tail --format json > tail.json || true
          node -e '
            const lines = require("fs").readFileSync("tail.json","utf8").split("\n").filter(Boolean);
            for (const l of lines) { let e; try { e = JSON.parse(l) } catch { continue }
              const url = e.event?.request?.url ?? ""; const path = url.replace(/^https?:\/\/[^/]+/, "").replace(/[?].*$/, "");
              const logs = (e.logs ?? []).map(x => x.message.join(" ")).join(" | ");
              if (/invite|push/i.test(path) || /push/i.test(logs) || (e.exceptions ?? []).length)
                console.log(new Date(e.eventTimestamp).toISOString(), e.event?.request?.method ?? "", path.replace(/[0-9a-f]{64}/, "<table>"), e.event?.response?.status ?? "", logs, JSON.stringify(e.exceptions ?? []));
            }' | tee -a $GITHUB_STEP_SUMMARY

  grant-gift:
    if: github.event_name == 'workflow_dispatch' && inputs.grant_gift == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm ci --prefix worker
      - name: Grant
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npx --yes tsx@4.19.2 scripts/grant-everyone-gift.ts | tee -a $GITHUB_STEP_SUMMARY

  rename:
    if: github.event_name == 'workflow_dispatch' && inputs.rename_from != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Rename
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FROM: ${{ inputs.rename_from }}
          TO: ${{ inputs.rename_to }}
        run: node scripts/admin-rename.mjs | tee -a $GITHUB_STEP_SUMMARY
