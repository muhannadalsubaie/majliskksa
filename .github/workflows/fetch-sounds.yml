# يجلب أصوات ورق حقيقية مسجّلة من حزمة Kenney "Casino Audio" (رخصة CC0 — بلا قيود)
# ويحوّلها إلى mp3 داخل public/sounds ثم يحفظها في المستودع. يعمل مرة عند تعديل هذا الملف.
name: Fetch card sounds

on:
  push:
    paths:
      - .github/workflows/fetch-sounds.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Kenney Casino Audio
        run: |
          set -e
          PAGE=$(curl -sL https://kenney.nl/assets/casino-audio)
          ZIP=$(echo "$PAGE" | grep -oE 'https://kenney\.nl/media/pages/assets/casino-audio/[^"]+\.zip' | head -1)
          echo "zip: $ZIP"
          curl -sL "$ZIP" -o /tmp/casino.zip
          mkdir -p /tmp/casino && unzip -o -q /tmp/casino.zip -d /tmp/casino
          echo "---- files ----"
          find /tmp/casino -type f | sed 's#/tmp/casino/##' | sort
          cat /tmp/casino/License.txt 2>/dev/null || find /tmp/casino -iname '*licen*' -exec cat {} \;
          # أصوات واقعية للمزايدة: طرق على طاولة خشب، وفنجان قهوة (حزمة Kenney "Impact Sounds"، رخصة CC0)
          PAGE=$(curl -sL https://kenney.nl/assets/impact-sounds)
          ZIP=$(echo "$PAGE" | grep -oE 'https://kenney\.nl/media/pages/assets/impact-sounds/[^"]+\.zip' | head -1)
          echo "impact zip: $ZIP"
          curl -sL "$ZIP" -o /tmp/impact.zip
          mkdir -p /tmp/impact && unzip -o -q /tmp/impact.zip -d /tmp/impact
          find /tmp/impact -type f -iname "*.ogg" | sed 's#.*/##' | sort | tr '\n' ' '
          # نغمة الدور (Kenney "Interface Sounds") ومقطوعات نهاية المباراة (Kenney "Music Jingles") — CC0
          for pack in interface-sounds music-jingles; do
            PAGE=$(curl -sL "https://kenney.nl/assets/$pack")
            ZIP=$(echo "$PAGE" | grep -oE "https://kenney\.nl/media/pages/assets/$pack/[^\"]+\.zip" | head -1)
            echo "$pack zip: $ZIP"
            curl -sL "$ZIP" -o "/tmp/$pack.zip"
            mkdir -p "/tmp/$pack" && unzip -o -q "/tmp/$pack.zip" -d "/tmp/$pack"
          done
          echo "---- casino ----"; find /tmp/casino -type f -iname "*.ogg" | sed 's#.*/##' | sort | tr '\n' ' '
      - name: Pick and convert
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p public/sounds
          pick() { find /tmp/casino -type f -iname "*.ogg" | grep -iE "$1" | sort | head -${2:-1}; }
          conv() { ffmpeg -loglevel error -y -i "$1" -ac 1 -ar 44100 -b:a 96k "public/sounds/$2.mp3"; echo "$2 <- $(basename "$1")"; }
          A=/tmp/casino/Audio
          for n in 1 2 3 4; do conv $A/card-place-$n.ogg card$n; conv $A/card-slide-$n.ogg slide$n; conv $A/card-shove-$n.ogg shove$n; done
          conv $A/card-shuffle.ogg shuffle
          conv $A/card-fan-1.ogg fan
          conv $A/chips-stack-1.ogg chips1
          conv $A/chips-stack-2.ogg chips2
          conv $A/chips-collide-1.ogg collide
          cp /tmp/casino/License.txt public/sounds/LICENSE-kenney.txt 2>/dev/null || true
          # الأصوات الموسيقية السابقة لم تعد مستخدمة
          rm -f public/sounds/bid-*.mp3
          # أول ملف يطابق الاسم (المسارات قد تحوي مسافات)
          ipick() { find /tmp/impact -type f -iname "*.ogg" | grep -iE "$1" | sort | sed -n "${2:-1}p"; }
          impact() {
            src=$(ipick "$1" "$3"); [ -n "$src" ] || { echo "no $1"; return; }
            ffmpeg -loglevel error -y -i "$src" -t 1.5 -ac 1 -ar 44100 -b:a 96k "public/sounds/$2.mp3"
            echo "$2 <- $(basename "$src")"
          }
          impact 'impactWood_heavy' knock1 1
          impact 'impactWood_heavy' knock2 2
          impact 'impactWood_heavy' knock3 3
          impact 'impactWood_medium' knock4 1
          impact 'impactWood_light' tap1 1
          impact 'impactPlate_light' cup1 1
          impact 'impactPlate_light' cup2 2
          # ───── أصوات إضافية (يُتجاوز أي ملف غير موجود في الحزمة) ─────
          # أول ملف يطابق النمط في مجلد الحزمة (المسارات قد تحوي مسافات)
          fpick() { find "$1" -type f -iname "*.ogg" | grep -iE "$2" | sort | sed -n "${3:-1}p"; }
          opt() {
            src=$(fpick "$1" "$2" "$4"); [ -n "$src" ] || { echo "skip $3 ($2)"; return 0; }
            ffmpeg -loglevel error -y -i "$src" -t "${5:-2}" -ac 1 -ar 44100 -b:a 96k "public/sounds/$3.mp3"
            echo "$3 <- $(basename "$src")"
          }
          # سحب الأكلة: انزلاق الورق
          for n in 5 6 7 8; do opt /tmp/casino "card-slide-$n" "slide$n"; done
          # نهاية الصكة: الفيش
          for n in 3 4 5 6; do opt /tmp/casino "chips-stack-$n" "chips$n"; done
          for n in 2 3 4; do opt /tmp/casino "chips-collide-$n" "collide$n"; done
          for n in 1 2 3; do opt /tmp/casino "chip-lay-$n" "lay$n"; done
          for n in 1 2 3; do opt /tmp/casino "chips-handle-$n" "handle$n"; done
          # نغمة "دورك" وبدائلها
          opt /tmp/interface-sounds 'glass_00' turn 1
          # مقطوعات نهاية المباراة (الافتراضي — وبدائلها في صفحة التجربة)
          opt /tmp/music-jingles 'jingles_STEEL' match-win 1 3
          opt /tmp/music-jingles 'jingles_SAX' match-lose 1 3
          opt /tmp/music-jingles 'jingles_HIT' kaboot 1 3

          # ───── صفحة تجربة الأصوات: بدائل يختار منها صاحب اللعبة بالسمع ─────
          rm -rf public/sounds/preview && mkdir -p public/sounds/preview
          prev() {
            find "$1" -type f -iname "*.ogg" | grep -iE "$2" | sort | while IFS= read -r f; do
              n=$(basename "$f" .ogg)
              ffmpeg -loglevel error -y -i "$f" -t 3 -ac 1 -ar 44100 -b:a 64k "public/sounds/preview/$n.mp3"
            done
          }
          prev /tmp/interface-sounds '(glass|confirmation|bong|pluck|select|maximize)_0'
          prev /tmp/music-jingles 'jingles_(STEEL|SAX|HIT|PIZZI|NES)'
          ls public/sounds/preview | sed 's/\.mp3$//' > public/sounds/preview/list.txt

          # ───── توحيد مستوى الصوت: نفس الارتفاع للجميع وذروة أقل من الحد (لا تشويه عند تداخل الأصوات) ─────
          norm() {
            f="$1"; target="$2"
            stats=$(ffmpeg -hide_banner -i "$f" -af volumedetect -f null - 2>&1)
            mean=$(echo "$stats" | sed -n 's/.*mean_volume: \(-*[0-9.]*\) dB/\1/p')
            peak=$(echo "$stats" | sed -n 's/.*max_volume: \(-*[0-9.]*\) dB/\1/p')
            gain=$(python3 -c "print(round(min($target - $mean, -3 - $peak), 2))")
            ffmpeg -loglevel error -y -i "$f" -af "volume=${gain}dB" -ac 1 -ar 44100 -b:a 96k "$f.tmp.mp3" && mv "$f.tmp.mp3" "$f"
            echo "norm $(basename "$f"): mean $mean peak $peak -> ${gain}dB"
          }
          for f in public/sounds/*.mp3; do norm "$f" -24; done
          # الموسيقى والنغمات أخفض قليلاً من أصوات الطاولة
          for f in public/sounds/preview/*.mp3 public/sounds/turn.mp3 public/sounds/match-*.mp3 public/sounds/kaboot.mp3; do [ -f "$f" ] && norm "$f" -26; done
          ls -la public/sounds
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add public/sounds
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Add CC0 card sounds from Kenney Casino Audio"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # الدفع من البوت لا يشغّل باقي الخطوات تلقائياً: نشغّل النشر وبناء الأندرويد بأنفسنا
      - name: Deploy with the new sounds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-worker.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run android.yml --ref "${GITHUB_REF_NAME}"
