# يجلب أصوات ورق حقيقية مسجّلة من حزمة Kenney "Casino Audio" (رخصة CC0 — بلا قيود)
# ويحوّلها إلى mp3 داخل public/sounds ثم يحفظها في المستودع. يعمل مرة عند تعديل هذا الملف.
name: Fetch card sounds

on:
  push:
    paths:
      - .github/workflows/fetch-sounds.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Kenney Casino Audio
        run: |
          set -e
          PAGE=$(curl -sL https://kenney.nl/assets/casino-audio)
          ZIP=$(echo "$PAGE" | grep -oE 'https://kenney\.nl/media/pages/assets/casino-audio/[^"]+\.zip' | head -1)
          echo "zip: $ZIP"
          curl -sL "$ZIP" -o /tmp/casino.zip
          mkdir -p /tmp/casino && unzip -o -q /tmp/casino.zip -d /tmp/casino
          echo "---- files ----"
          find /tmp/casino -type f | sed 's#/tmp/casino/##' | sort
          cat /tmp/casino/License.txt 2>/dev/null || find /tmp/casino -iname '*licen*' -exec cat {} \;
          # أصوات واقعية للمزايدة: طرق على طاولة خشب، وفنجان قهوة (حزمة Kenney "Impact Sounds"، رخصة CC0)
          PAGE=$(curl -sL https://kenney.nl/assets/impact-sounds)
          ZIP=$(echo "$PAGE" | grep -oE 'https://kenney\.nl/media/pages/assets/impact-sounds/[^"]+\.zip' | head -1)
          echo "impact zip: $ZIP"
          curl -sL "$ZIP" -o /tmp/impact.zip
          mkdir -p /tmp/impact && unzip -o -q /tmp/impact.zip -d /tmp/impact
          find /tmp/impact -type f -iname "*.ogg" | sed 's#.*/##' | sort | tr '\n' ' '
      - name: Pick and convert
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p public/sounds
          pick() { find /tmp/casino -type f -iname "*.ogg" | grep -iE "$1" | sort | head -${2:-1}; }
          conv() { ffmpeg -loglevel error -y -i "$1" -ac 1 -ar 44100 -b:a 96k "public/sounds/$2.mp3"; echo "$2 <- $(basename "$1")"; }
          A=/tmp/casino/Audio
          for n in 1 2 3 4; do conv $A/card-place-$n.ogg card$n; conv $A/card-slide-$n.ogg slide$n; conv $A/card-shove-$n.ogg shove$n; done
          conv $A/card-shuffle.ogg shuffle
          conv $A/card-fan-1.ogg fan
          conv $A/chips-stack-1.ogg chips1
          conv $A/chips-stack-2.ogg chips2
          conv $A/chips-collide-1.ogg collide
          cp /tmp/casino/License.txt public/sounds/LICENSE-kenney.txt 2>/dev/null || true
          # الأصوات الموسيقية السابقة لم تعد مستخدمة
          rm -f public/sounds/bid-*.mp3
          # أول ملف يطابق الاسم (المسارات قد تحوي مسافات)
          ipick() { find /tmp/impact -type f -iname "*.ogg" | grep -iE "$1" | sort | sed -n "${2:-1}p"; }
          impact() {
            src=$(ipick "$1" "$3"); [ -n "$src" ] || { echo "no $1"; return; }
            ffmpeg -loglevel error -y -i "$src" -t 1.5 -ac 1 -ar 44100 -b:a 96k "public/sounds/$2.mp3"
            echo "$2 <- $(basename "$src")"
          }
          impact 'impactWood_heavy' knock1 1
          impact 'impactWood_heavy' knock2 2
          impact 'impactWood_heavy' knock3 3
          impact 'impactWood_medium' knock4 1
          impact 'impactWood_light' tap1 1
          impact 'impactPlate_light' cup1 1
          impact 'impactPlate_light' cup2 2
          ls -la public/sounds
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add public/sounds
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Add CC0 card sounds from Kenney Casino Audio"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # الدفع من البوت لا يشغّل باقي الخطوات تلقائياً: نشغّل النشر وبناء الأندرويد بأنفسنا
      - name: Deploy with the new sounds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-worker.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run android.yml --ref "${GITHUB_REF_NAME}"
